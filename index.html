<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小许 A2 学习系统</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --primary:#4f46e5;--primary2:#eef2ff;--good:#15803d;--bad:#b91c1c;--warn:#b45309;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1080px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.soft{background:var(--primary2);border-color:#c7d2fe;color:#3730a3}
.btn.danger{color:var(--bad)}
.tabs{display:flex;gap:8px;margin:12px 0 20px}
.tab{border:none;background:transparent;padding:10px 15px;border-radius:10px;color:var(--muted)}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat b{font-size:28px;display:block;margin-top:8px}.stat span{font-size:13px;color:var(--muted)}
.panel{margin-top:14px}
.panel h2{font-size:18px;margin:0 0 14px}
.hidden{display:none!important}
.word-card{min-height:330px;display:flex;flex-direction:column;justify-content:space-between}
.word-main{text-align:center;padding:28px 10px}
.word-main .word{font-size:36px;font-weight:700}
.word-main .meta{margin-top:10px;color:var(--muted)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.badge{padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}
.badge.a{background:#fee2e2;color:#991b1b}.badge.r{background:#dbeafe;color:#1d4ed8}.badge.g{background:#dcfce7;color:#166534}
.answer{border-top:1px solid var(--line);padding-top:16px;margin-top:14px}
.detail-row{margin:8px 0}.detail-label{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.test-box{max-width:700px;margin:0 auto}
.question{font-size:23px;font-weight:650;line-height:1.5;margin:12px 0 18px}
.answer-input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.feedback{margin-top:12px;padding:12px;border-radius:10px}
.feedback.good{background:#ecfdf5;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}
.option-list{display:grid;gap:8px}.option{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.small{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.item-top{display:flex;justify-content:space-between;gap:10px}
.item-title{font-weight:650}.item-meta{font-size:12px;color:var(--muted);margin-top:5px}
.progress{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
code{background:#f3f4f6;padding:2px 5px;border-radius:5px}
@media(max-width:760px){
 .app{padding:14px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
 header{align-items:flex-start;flex-direction:column}.word-main .word{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>小许 A2 学习系统</h1>
      <div class="sub">单词 · 测试 · 错题 · 间隔复习</div>
    </div>
    <div class="actions">
      <button class="btn" id="importBtn">导入学习包</button>
      <button class="btn" id="exportBtn">导出进度</button>
      <button class="btn danger" id="resetBtn">重置示例</button>
      <input id="fileInput" type="file" accept=".json" class="hidden" />
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="home">首页</button>
    <button class="tab" data-tab="vocab">单词</button>
    <button class="tab" data-tab="errors">错题</button>
  </div>

  <section id="home" class="view">
    <div class="grid">
      <div class="stat"><span>今日到期单词</span><b id="statDueVocab">0</b></div>
      <div class="stat"><span>薄弱词</span><b id="statWeak">0</b></div>
      <div class="stat"><span>待复习错题</span><b id="statDueErrors">0</b></div>
      <div class="stat"><span>已学习单词</span><b id="statLearned">0</b></div>
    </div>
    <div class="panel">
      <h2>今天做什么</h2>
      <div class="two">
        <div class="item">
          <div class="item-title">📖 单词学习 / 复习</div>
          <div class="item-meta" id="homeVocabHint"></div>
          <div class="controls" style="justify-content:flex-start">
            <button class="btn primary" onclick="goTab('vocab');showVocabMode('study')">开始学习</button>
            <button class="btn soft" onclick="goTab('vocab');showVocabMode('test')">开始测试</button>
          </div>
        </div>
        <div class="item">
          <div class="item-title">✏️ 错题复习</div>
          <div class="item-meta" id="homeErrorHint"></div>
          <div class="controls" style="justify-content:flex-start">
            <button class="btn primary" onclick="goTab('errors');startErrorReview()">开始复习</button>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>复习逻辑</h2>
      <div class="small">
        采用“遗忘曲线思路”的间隔复习：首次学习后先短间隔回顾，连续答对后逐步拉长；
        答错会缩短间隔，并在当前测试轮稍后再次出现。这里不是声称存在唯一固定的“艾宾浩斯标准间隔”，而是用其遗忘规律做实用化调度。
      </div>
    </div>
  </section>

  <section id="vocab" class="view hidden">
    <div class="panel">
      <div class="toolbar">
        <button class="btn primary" onclick="showVocabMode('study')">学习</button>
        <button class="btn" onclick="showVocabMode('test')">测试</button>
        <select id="vocabFilter">
          <option value="all">全部</option>
          <option value="new">尚未学习</option>
          <option value="due">今日到期</option>
          <option value="weak">薄弱词</option>
          <option value="A">A 主动词</option>
          <option value="R">R 识别词</option>
          <option value="G">G 格支配</option>
        </select>
        <span class="small" id="vocabCount"></span>
      </div>

      <div id="studyMode">
        <div class="word-card">
          <div>
            <div class="word-main">
              <div class="word" id="studyWord">—</div>
              <div class="meta" id="studyMeta"></div>
              <div class="badges" id="studyBadges"></div>
            </div>
            <div id="studyAnswer" class="answer hidden"></div>
          </div>
          <div class="controls">
            <button class="btn" onclick="prevStudy()">← 上一个</button>
            <button class="btn primary" id="flipBtn" onclick="flipStudy()">翻转</button>
            <button class="btn soft hidden" id="learnedBtn" onclick="markLearned()">完成首次学习</button>
            <button class="btn" onclick="nextStudy()">下一个 →</button>
          </div>
        </div>
      </div>

      <div id="testMode" class="hidden">
        <div class="test-box">
          <div class="small" id="testType"></div>
          <div class="question" id="testQuestion">点击“开始测试”</div>
          <div id="testOptions" class="option-list hidden"></div>
          <input id="testInput" class="answer-input" placeholder="输入答案后按 Enter" />
          <div id="testFeedback"></div>
          <div class="controls">
            <button class="btn primary" id="startTestBtn" onclick="startTest()">开始测试</button>
            <button class="btn soft hidden" id="nextTestBtn" onclick="nextTest()">下一题</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>单词库</h2>
      <div id="vocabList" class="list"></div>
    </div>
  </section>

  <section id="errors" class="view hidden">
    <div class="panel">
      <div class="toolbar">
        <button class="btn primary" onclick="startErrorReview()">复习到期错题</button>
        <select id="errorFilter" onchange="renderErrorList()">
          <option value="all">全部</option>
          <option value="due">待复习</option>
          <option value="learning">巩固中</option>
          <option value="mastered">已掌握</option>
        </select>
      </div>
      <div id="errorReview" class="hidden">
        <div class="test-box">
          <div class="small" id="errorMeta"></div>
          <div class="question" id="errorQuestion"></div>
          <input id="errorInput" class="answer-input" placeholder="输入你的答案" />
          <div id="errorFeedback"></div>
          <div class="controls">
            <button class="btn primary" id="checkErrorBtn" onclick="checkError()">提交</button>
            <button class="btn soft hidden" id="nextErrorBtn" onclick="nextError()">下一题</button>
          </div>
        </div>
        <hr />
      </div>
      <div id="errorList" class="list"></div>
    </div>
  </section>
</div>

<script>
const SAMPLE = {"schema_version": "1.0", "student": "小许", "batch": "XUXU-A2-VOCAB-001", "vocabulary": [{"id": "v001", "word": "встреча́ть", "plain": "встречать", "pos": "动词", "level": "A", "g": true, "meaning": "接、迎接；遇见", "aspect": {"impf": "встреча́ть", "pf": "встре́тить"}, "government": [{"pattern": "встреча́ть кого? что?", "case": "винительный", "case_no": 4, "case_cn": "四格"}], "usage": ["встреча́ть друга", "встреча́ть гостей"], "example": "Я встреча́ю друга на вокза́ле.", "source": "示例词库", "sense_question": null}, {"id": "v002", "word": "горди́ться", "plain": "гордиться", "pos": "动词", "level": "A", "g": true, "meaning": "为……感到骄傲", "aspect": {"impf": "горди́ться", "pf": null}, "government": [{"pattern": "горди́ться кем? чем?", "case": "творительный", "case_no": 5, "case_cn": "五格"}], "usage": ["горди́ться сы́ном", "горди́ться свои́ми ученика́ми"], "example": "Она́ горди́тся свои́м сы́ном.", "source": "示例词库", "sense_question": null}, {"id": "v003", "word": "экску́рсия", "plain": "экскурсия", "pos": "名词", "level": "R", "g": false, "meaning": "参观；游览；讲解活动", "aspect": null, "government": [], "usage": ["ходи́ть на экску́рсию", "интере́сная экску́рсия"], "example": "Сего́дня в музе́е интере́сная экску́рсия.", "source": "示例词库", "sense_question": null}, {"id": "v004", "word": "плати́ть", "plain": "платить", "pos": "动词", "level": "A", "g": true, "meaning": "支付；付款", "aspect": {"impf": "плати́ть", "pf": "заплати́ть"}, "government": [{"pattern": "плати́ть за кого? за что?", "case": "винительный", "case_no": 4, "case_cn": "四格"}, {"pattern": "плати́ть кому?", "case": "дательный", "case_no": 3, "case_cn": "三格"}], "usage": ["плати́ть за биле́т", "плати́ть врачу́"], "example": "Я заплати́л за биле́т.", "source": "示例词库", "sense_question": {"prompt": "“плати́ть” 和 “купи́ть” 哪个表示“付款/支付”而不是“购买”？", "options": ["плати́ть", "купи́ть"], "answer": "плати́ть"}}, {"id": "v005", "word": "одева́ть", "plain": "одевать", "pos": "动词", "level": "A", "g": true, "meaning": "给某人穿衣服", "aspect": {"impf": "одева́ть", "pf": "оде́ть"}, "government": [{"pattern": "одева́ть кого?", "case": "винительный", "case_no": 4, "case_cn": "四格"}], "usage": ["одева́ть ребёнка"], "example": "Ма́ма одева́ет ребёнка.", "source": "示例词库", "sense_question": {"prompt": "“自己穿上外套”更适合用哪个动词？", "options": ["одева́ть", "надева́ть"], "answer": "надева́ть"}}, {"id": "v006", "word": "похо́жий", "plain": "похожий", "pos": "形容词", "level": "R", "g": true, "meaning": "相像的；类似的", "aspect": null, "government": [{"pattern": "похо́жий на кого? на что?", "case": "винительный", "case_no": 4, "case_cn": "四格"}], "usage": ["похо́жий на ма́му", "э́ти слова́ похо́жи"], "example": "Он похо́ж на отца́.", "source": "示例词库", "sense_question": null}], "errors": [{"id": "e001", "prompt": "Анна вчера ___ в театр.", "student_answer": "ходил", "correct_answer": "ходила", "explanation": "过去时需要和主语在性、数上保持一致；Анна 是阴性单数，所以用 ходила。", "tags": ["过去时", "性数一致"], "source": "示例错题"}, {"id": "e002", "prompt": "Мы едем ___ метро.", "student_answer": "в", "correct_answer": "на метро", "explanation": "表示乘坐交通工具时常用 на + 前置格：на метро, на автобусе。", "tags": ["介词", "交通工具"], "source": "示例错题"}, {"id": "e003", "prompt": "Я горжусь ___ . (мой брат)", "student_answer": "мой брат", "correct_answer": "моим братом", "explanation": "гордиться кем? чем? 要求工具格（五格）。", "tags": ["格支配", "五格"], "source": "示例错题"}]};
const REVIEW_INTERVALS = [
  10 * 60 * 1000,      // 10 min
  24 * 60 * 60 * 1000, // 1 day
  3 * 24 * 60 * 60 * 1000,
  7 * 24 * 60 * 60 * 1000,
  14 * 24 * 60 * 60 * 1000,
  30 * 24 * 60 * 60 * 1000,
  60 * 24 * 60 * 60 * 1000
];
const ERROR_INTERVALS = [
  24 * 60 * 60 * 1000,
  3 * 24 * 60 * 60 * 1000,
  7 * 24 * 60 * 60 * 1000,
  14 * 24 * 60 * 60 * 1000,
  30 * 24 * 60 * 60 * 1000
];

let db = loadDB();
let studyIndex = 0;
let currentStudyList = [];
let testQueue = [];
let currentTest = null;
let errorQueue = [];
let currentError = null;

function now(){ return Date.now(); }
function normalize(s){
  return String(s ?? "")
    .toLowerCase()
    .replace(/[́̀]/g,"")
    .replace(/ё/g,"е")
    .replace(/[.,!?;:"'“”‘’()]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function deepClone(x){ return JSON.parse(JSON.stringify(x)); }

function initProgress(data){
  data.vocabulary = (data.vocabulary||[]).map(v => ({
    ...v,
    progress: v.progress || {
      learned:false, stage:0, nextReview:null, correct:0, wrong:0, lapses:0,
      lastResult:null, lastTestType:null
    }
  }));
  data.errors = (data.errors||[]).map(e => ({
    ...e,
    progress:e.progress || {
      stage:0, nextReview:Date.now(), correct:0, wrong:0, status:"due"
    }
  }));
  return data;
}
function loadDB(){
  const saved = localStorage.getItem("xiaoxu_a2_db");
  if(saved){
    try{return initProgress(JSON.parse(saved));}catch(e){}
  }
  const d=initProgress(deepClone(SAMPLE));
  localStorage.setItem("xiaoxu_a2_db",JSON.stringify(d));
  return d;
}
function saveDB(){
  localStorage.setItem("xiaoxu_a2_db",JSON.stringify(db));
  renderAll();
}

function isDue(p){
  return p.learned && p.nextReview != null && p.nextReview <= now();
}
function isWeak(v){
  const p=v.progress;
  return p.wrong>=2 || p.lapses>=1 || (p.correct+p.wrong>=2 && p.wrong/(p.correct+p.wrong)>=0.4);
}
function dueErrors(){
  return db.errors.filter(e => !e.progress.nextReview || e.progress.nextReview <= now());
}
function fmtDate(ts){
  if(!ts) return "未安排";
  const d=new Date(ts);
  return d.toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function goTab(tab){
  document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));
  document.getElementById(tab).classList.remove("hidden");
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  renderAll();
}
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>goTab(btn.dataset.tab));

function renderHome(){
  const due=db.vocabulary.filter(v=>isDue(v.progress)).length;
  const weak=db.vocabulary.filter(isWeak).length;
  const dueE=dueErrors().length;
  const learned=db.vocabulary.filter(v=>v.progress.learned).length;
  statDueVocab.textContent=due; statWeak.textContent=weak; statDueErrors.textContent=dueE; statLearned.textContent=learned;
  const fresh=db.vocabulary.filter(v=>!v.progress.learned).length;
  homeVocabHint.textContent = fresh
    ? `还有 ${fresh} 个新词未首次学习；${due} 个复习到期。`
    : `新词已完成首次学习；${due} 个复习到期。`;
  homeErrorHint.textContent=`当前有 ${dueE} 道错题到期。`;
}

function filteredVocab(){
  const f=document.getElementById("vocabFilter")?.value || "all";
  return db.vocabulary.filter(v=>{
    if(f==="all") return true;
    if(f==="new") return !v.progress.learned;
    if(f==="due") return isDue(v.progress);
    if(f==="weak") return isWeak(v);
    if(f==="A"||f==="R") return v.level===f;
    if(f==="G") return !!v.g;
    return true;
  });
}

function renderStudy(){
  currentStudyList=filteredVocab();
  if(studyIndex>=currentStudyList.length) studyIndex=0;
  const v=currentStudyList[studyIndex];
  vocabCount.textContent=`${currentStudyList.length} / ${db.vocabulary.length} 词`;
  if(!v){
    studyWord.textContent="这里还没有词";
    studyMeta.textContent="";
    studyBadges.innerHTML="";
    studyAnswer.innerHTML="";
    flipBtn.classList.add("hidden"); learnedBtn.classList.add("hidden");
    return;
  }
  flipBtn.classList.remove("hidden");
  studyWord.textContent=v.word;
  studyMeta.textContent=[v.pos,v.source].filter(Boolean).join(" · ");
  studyBadges.innerHTML=`<span class="badge ${v.level.toLowerCase()}">${v.level==="A"?"A 主动":"R 识别"}</span>`+
    (v.g?`<span class="badge g">G 格支配</span>`:"")+
    (isWeak(v)?`<span class="badge">薄弱</span>`:"");
  const aspect = v.aspect ? `${v.aspect.impf||"—"} / ${v.aspect.pf||"—"}` : "";
  const gov=(v.government||[]).map(g=>`${escapeHtml(g.pattern)} <span class="small">(${escapeHtml(g.case_cn||g.case||"")})</span>`).join("<br>");
  const usage=(v.usage||[]).map(escapeHtml).join("；");
  studyAnswer.innerHTML=`
    <div class="detail-row"><div class="detail-label">核心义</div>${escapeHtml(v.meaning)}</div>
    ${aspect?`<div class="detail-row"><div class="detail-label">体对</div>${escapeHtml(aspect)}</div>`:""}
    ${gov?`<div class="detail-row"><div class="detail-label">格支配 / 结构</div>${gov}</div>`:""}
    ${usage?`<div class="detail-row"><div class="detail-label">基本用法</div>${usage}</div>`:""}
    ${v.example?`<div class="detail-row"><div class="detail-label">例句</div>${escapeHtml(v.example)}</div>`:""}
    ${v.sense_question?`<div class="detail-row"><div class="detail-label">词义辨析</div>${escapeHtml(v.sense_question.prompt)}</div>`:""}
    <div class="detail-row"><div class="detail-label">复习状态</div>
      ${v.progress.learned ? `第 ${v.progress.stage+1} 阶段 · 下次 ${fmtDate(v.progress.nextReview)}` : "尚未完成首次学习"}
    </div>`;
  studyAnswer.classList.add("hidden");
  learnedBtn.classList.toggle("hidden",v.progress.learned);
  flipBtn.textContent="翻转";
}
function flipStudy(){
  const hidden=studyAnswer.classList.toggle("hidden");
  flipBtn.textContent=hidden?"翻转":"收起";
}
function markLearned(){
  const v=currentStudyList[studyIndex];
  if(!v) return;
  v.progress.learned=true;
  v.progress.stage=0;
  v.progress.nextReview=now()+REVIEW_INTERVALS[0];
  saveDB();
  renderStudy();
}
function nextStudy(){ if(currentStudyList.length){studyIndex=(studyIndex+1)%currentStudyList.length;renderStudy();}}
function prevStudy(){ if(currentStudyList.length){studyIndex=(studyIndex-1+currentStudyList.length)%currentStudyList.length;renderStudy();}}
document.getElementById("vocabFilter").onchange=()=>{studyIndex=0;renderStudy();renderVocabList();};

function showVocabMode(mode){
  studyMode.classList.toggle("hidden",mode!=="study");
  testMode.classList.toggle("hidden",mode!=="test");
  if(mode==="study") renderStudy();
}

function governmentAliases(g){
  const c=normalize(g.case||"");
  const n=String(g.case_no||"");
  const cn=normalize(g.case_cn||"");
  const map={
    "родительный":["родительный","родительный падеж","р.п","рп","2","2格","二格","чего","кого"],
    "дательный":["дательный","дательный падеж","д.п","дп","3","3格","三格","чему","кому"],
    "винительный":["винительный","винительный падеж","в.п","вп","4","4格","四格","что","кого"],
    "творительный":["творительный","творительный падеж","т.п","тп","5","5格","五格","чем","кем"],
    "предложный":["предложный","предложный падеж","п.п","пп","6","6格","六格","о чем","о ком","чем","ком"],
    "именительный":["именительный","именительный падеж","и.п","ип","1","1格","一格","что","кто"]
  };
  return Array.from(new Set([c,n,cn,...(map[c]||[])].map(normalize).filter(Boolean)));
}
function govIsCorrect(input,g){
  const x=normalize(input);
  if(governmentAliases(g).includes(x)) return true;
  // If learner typed the case-question pair, accept either half or the full pair.
  const pattern=normalize(g.pattern||"");
  const qs=(pattern.match(/(кого|чего|кому|чему|кого|что|кем|чем|ком)/g)||[]);
  return qs.some(q=>x===q);
}

function buildTestQueue(){
  const due=db.vocabulary.filter(v=>isDue(v.progress));
  const pool=due.length?due:db.vocabulary.filter(v=>v.progress.learned);
  const tasks=[];
  pool.forEach(v=>{
    if(v.level==="R"){
      tasks.push({vocabId:v.id,type:"R_ZH"});
    }else{
      tasks.push({vocabId:v.id,type:"A_RU"});
      tasks.push({vocabId:v.id,type:"R_ZH"});
    }
    if(v.g && (v.government||[]).length){
      v.government.forEach((g,i)=>tasks.push({vocabId:v.id,type:"G",govIndex:i}));
    }
    if(v.sense_question) tasks.push({vocabId:v.id,type:"SENSE"});
  });
  // weak items appear one extra time in the same session
  pool.filter(isWeak).forEach(v=>{
    tasks.push({vocabId:v.id,type:v.level==="A"?"A_RU":"R_ZH"});
    if(v.g && (v.government||[]).length) tasks.push({vocabId:v.id,type:"G",govIndex:0});
  });
  return tasks.sort(()=>Math.random()-.5);
}
function startTest(){
  testQueue=buildTestQueue();
  if(!testQueue.length){
    testQuestion.textContent="还没有可测试的词。先完成首次学习，或等复习到期。";
    return;
  }
  startTestBtn.classList.add("hidden");
  nextTestBtn.classList.add("hidden");
  loadNextTest();
}
function loadNextTest(){
  testFeedback.innerHTML="";
  testOptions.innerHTML=""; testOptions.classList.add("hidden");
  testInput.classList.remove("hidden"); testInput.value=""; testInput.disabled=false;
  currentTest=testQueue.shift();
  if(!currentTest){
    testType.textContent="";
    testQuestion.textContent="🎉 本轮测试完成";
    testInput.classList.add("hidden");
    startTestBtn.classList.remove("hidden");
    startTestBtn.textContent="再来一轮";
    saveDB();
    return;
  }
  const v=db.vocabulary.find(x=>x.id===currentTest.vocabId);
  if(currentTest.type==="R_ZH"){
    testType.textContent="R · 俄 → 中";
    testQuestion.textContent=v.word;
    testInput.placeholder="输入中文核心义";
  }else if(currentTest.type==="A_RU"){
    testType.textContent="A · 中 → 俄";
    testQuestion.textContent=v.meaning;
    testInput.placeholder="输入俄语词";
  }else if(currentTest.type==="G"){
    const g=v.government[currentTest.govIndex];
    testType.textContent="G · 格支配";
    testQuestion.textContent=`${v.word}：${g.pattern} —— 这里要求第几格？`;
    testInput.placeholder="可答：чего / 2格 / 二格 / родительный";
  }else if(currentTest.type==="SENSE"){
    testType.textContent="词义辨析";
    testQuestion.textContent=v.sense_question.prompt;
    testInput.classList.add("hidden");
    testOptions.classList.remove("hidden");
    v.sense_question.options.forEach(opt=>{
      const b=document.createElement("button"); b.className="option"; b.textContent=opt;
      b.onclick=()=>checkTest(opt); testOptions.appendChild(b);
    });
  }
  setTimeout(()=>{ if(!testInput.classList.contains("hidden")) testInput.focus(); },50);
}
testInput.addEventListener("keydown",e=>{if(e.key==="Enter" && !testInput.disabled) checkTest(testInput.value);});

function checkTest(raw){
  if(!currentTest) return;
  const v=db.vocabulary.find(x=>x.id===currentTest.vocabId);
  let correct=false, answer="";
  if(currentTest.type==="R_ZH"){
    const expected=normalize(v.meaning);
    const input=normalize(raw);
    // Prototype: recognize major chunks rather than exact punctuation.
    const keys=expected.split(/[；;，,、]/).map(normalize).filter(Boolean);
    correct=keys.some(k=>input.includes(k) || k.includes(input)) && input.length>0;
    answer=v.meaning;
  }else if(currentTest.type==="A_RU"){
    correct=normalize(raw)===normalize(v.plain||v.word);
    answer=v.word;
  }else if(currentTest.type==="G"){
    const g=v.government[currentTest.govIndex];
    correct=govIsCorrect(raw,g);
    answer=`${g.case_cn||""} / ${g.case||""}`;
  }else if(currentTest.type==="SENSE"){
    correct=normalize(raw)===normalize(v.sense_question.answer);
    answer=v.sense_question.answer;
  }
  recordVocabResult(v,correct,currentTest.type);
  testInput.disabled=true;
  [...testOptions.children].forEach(b=>b.disabled=true);
  testFeedback.innerHTML=`<div class="feedback ${correct?"good":"bad"}">
    ${correct?"✅ 正确":"❌ 这次不对"}<br>
    <span class="small">答案：${escapeHtml(answer)}</span>
  </div>`;
  if(!correct){
    // reinsert after several cards to force near-term retrieval, but avoid an endless loop
    const retry={...currentTest,retry:true};
    testQueue.splice(Math.min(3,testQueue.length),0,retry);
  }
  nextTestBtn.classList.remove("hidden");
  saveDB();
}
function nextTest(){ nextTestBtn.classList.add("hidden"); loadNextTest(); }

function recordVocabResult(v,correct,type){
  const p=v.progress;
  p.lastResult=correct?"correct":"wrong"; p.lastTestType=type;
  if(correct){
    p.correct++;
    p.stage=Math.min(p.stage+1,REVIEW_INTERVALS.length-1);
    const base=REVIEW_INTERVALS[p.stage];
    // weak words advance more cautiously until their recent error burden falls
    const weakFactor=isWeak(v)?0.55:1;
    p.nextReview=now()+Math.max(REVIEW_INTERVALS[0],Math.round(base*weakFactor));
  }else{
    p.wrong++; p.lapses++;
    p.stage=Math.max(0,p.stage-2);
    p.nextReview=now()+REVIEW_INTERVALS[0];
  }
}

function renderVocabList(){
  const list=filteredVocab();
  vocabList.innerHTML=list.map(v=>{
    const p=v.progress;
    return `<div class="item">
      <div class="item-top">
        <div>
          <div class="item-title">${escapeHtml(v.word)}</div>
          <div class="item-meta">${escapeHtml(v.meaning)} · ${v.level}${v.g?"/G":""}</div>
        </div>
        <div class="small">${p.learned?`阶段 ${p.stage+1}`:"未学"}</div>
      </div>
      <div class="item-meta">
        ${p.learned?`下次：${fmtDate(p.nextReview)} · 对 ${p.correct} / 错 ${p.wrong}`:"等待首次学习"}
        ${isWeak(v)?" · ⚠️ 薄弱":""}
      </div>
    </div>`;
  }).join("") || `<div class="small">当前筛选条件下没有词。</div>`;
}

function errorStatus(e){
  if(e.progress.status==="mastered") return "已掌握";
  if(!e.progress.nextReview || e.progress.nextReview<=now()) return "待复习";
  return "巩固中";
}
function renderErrorList(){
  const f=errorFilter?.value||"all";
  const arr=db.errors.filter(e=>{
    if(f==="all")return true;
    if(f==="due")return !e.progress.nextReview || e.progress.nextReview<=now();
    if(f==="learning")return e.progress.status==="learning";
    if(f==="mastered")return e.progress.status==="mastered";
  });
  errorList.innerHTML=arr.map(e=>`<div class="item">
    <div class="item-title">${escapeHtml(e.prompt)}</div>
    <div class="item-meta">当时答案：${escapeHtml(e.student_answer)} → 正确：${escapeHtml(e.correct_answer)}</div>
    <div class="item-meta">${escapeHtml((e.tags||[]).join(" / "))} · ${escapeHtml(e.source||"")}</div>
    <div class="item-meta">${errorStatus(e)} · 下次：${fmtDate(e.progress.nextReview)}</div>
  </div>`).join("") || `<div class="small">没有符合条件的错题。</div>`;
}

function startErrorReview(){
  goTab("errors");
  errorQueue=dueErrors();
  if(!errorQueue.length){
    errorReview.classList.remove("hidden");
    errorQuestion.textContent="🎉 当前没有到期错题";
    errorInput.classList.add("hidden"); checkErrorBtn.classList.add("hidden"); nextErrorBtn.classList.add("hidden");
    return;
  }
  errorReview.classList.remove("hidden"); errorInput.classList.remove("hidden"); checkErrorBtn.classList.remove("hidden");
  loadError();
}
function loadError(){
  errorFeedback.innerHTML=""; nextErrorBtn.classList.add("hidden"); checkErrorBtn.classList.remove("hidden");
  errorInput.value=""; errorInput.disabled=false; errorInput.classList.remove("hidden");
  currentError=errorQueue.shift();
  if(!currentError){
    errorQuestion.textContent="🎉 本轮错题复习完成";
    errorMeta.textContent=""; errorInput.classList.add("hidden"); checkErrorBtn.classList.add("hidden");
    saveDB();return;
  }
  errorQuestion.textContent=currentError.prompt;
  errorMeta.textContent=`${(currentError.tags||[]).join(" / ")} · ${currentError.source||""}`;
  errorInput.focus();
}
errorInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!errorInput.disabled)checkError();});
function checkError(){
  if(!currentError)return;
  const raw=errorInput.value;
  const ok=normalize(raw)===normalize(currentError.correct_answer);
  const p=currentError.progress;
  if(ok){
    p.correct++; p.stage=Math.min(p.stage+1,ERROR_INTERVALS.length-1);
    p.nextReview=now()+ERROR_INTERVALS[p.stage];
    p.status=p.stage>=3?"mastered":"learning";
  }else{
    p.wrong++; p.stage=0; p.nextReview=now()+10*60*1000; p.status="due";
    errorQueue.splice(Math.min(2,errorQueue.length),0,currentError);
  }
  errorInput.disabled=true;
  errorFeedback.innerHTML=`<div class="feedback ${ok?"good":"bad"}">
    ${ok?"✅ 正确":"❌ 这次不对"}<br>
    <b>正确答案：</b>${escapeHtml(currentError.correct_answer)}<br>
    <b>你当时写：</b>${escapeHtml(currentError.student_answer)}<br>
    <span class="small">${escapeHtml(currentError.explanation)}</span>
  </div>`;
  checkErrorBtn.classList.add("hidden"); nextErrorBtn.classList.remove("hidden");
  saveDB();
}
function nextError(){loadError();}

function renderAll(){
  renderHome(); renderStudy(); renderVocabList(); renderErrorList();
}

importBtn.onclick=()=>fileInput.click();
fileInput.onchange=async(e)=>{
  const file=e.target.files[0]; if(!file)return;
  try{
    const incoming=JSON.parse(await file.text());
    const merged=mergePack(db,incoming);
    db=initProgress(merged); saveDB();
    alert("导入成功。重复词会按 plain/word 合并，已有学习进度会保留。");
  }catch(err){alert("导入失败："+err.message);}
  e.target.value="";
};
function mergePack(oldDb,incoming){
  const result=deepClone(oldDb);
  const existingByPlain=new Map(result.vocabulary.map(v=>[normalize(v.plain||v.word),v]));
  (incoming.vocabulary||[]).forEach(nv=>{
    const key=normalize(nv.plain||nv.word);
    if(existingByPlain.has(key)){
      const old=existingByPlain.get(key);
      const progress=old.progress;
      Object.assign(old,nv,{progress});
      // merge sources when possible
      if(old.source && nv.source && !String(old.source).includes(nv.source)) old.source=`${old.source} / ${nv.source}`;
    }else result.vocabulary.push(nv);
  });
  const existingErrors=new Set(result.errors.map(e=>e.id));
  (incoming.errors||[]).forEach(ne=>{if(!existingErrors.has(ne.id))result.errors.push(ne);});
  result.batch=incoming.batch||result.batch;
  return result;
}

exportBtn.onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`XUXU-A2-PROGRESS-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
resetBtn.onclick=()=>{
  if(confirm("确定重置为示例数据吗？当前浏览器里的学习进度会清空。")){
    db=initProgress(deepClone(SAMPLE)); saveDB();
  }
};

renderAll();
