<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小许 A2 学习系统 v2.4</title>
<style>
:root{
 --bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e2e7ef;
 --primary:#5547e8;--primary-soft:#efefff;--good:#167a45;--good-bg:#ecf9f1;
 --bad:#b53636;--bad-bg:#fff0f0;--warn:#9a6200;--warn-bg:#fff7df;
}
*{box-sizing:border-box}
html{
 scroll-behavior:auto;
 height:auto;
 min-height:100%;
 overflow-x:hidden;
 overflow-y:auto;
}
body{
 margin:0;
 min-height:100%;
 overflow-x:hidden;
 overflow-y:auto;
 overscroll-behavior-y:auto;
 -webkit-overflow-scrolling:touch;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif
}
button,input,select{font:inherit} button{cursor:pointer}
.app{max-width:1040px;margin:0 auto;padding:18px 16px 90px;overflow:visible}
header{padding:6px 2px 12px}
h1{margin:0;font-size:24px}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;margin:4px 0 16px;position:sticky;top:0;background:rgba(246,247,251,.94);backdrop-filter:blur(7px);padding:8px 0;z-index:3;overflow:visible}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px;color:var(--muted)}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:16px}
.view,.panel,.library-body,.word-card,.test-box{overflow:visible}
.panel{padding:16px;margin-top:12px}.panel h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:15px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:26px;margin-top:5px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.soft{background:var(--primary-soft);border-color:#cbc8ff;color:#3f35ba}
.btn:disabled{opacity:.55;cursor:not-allowed}
.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.item-title{font-weight:700}.item-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.word-card{min-height:370px;display:flex;flex-direction:column;justify-content:space-between}
.counter{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.word-main{text-align:center;padding:28px 8px 8px}
.word{font-size:38px;font-weight:760;letter-spacing:.2px}
.meta{color:var(--muted);margin-top:7px;font-size:14px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.badge{font-size:12px;border-radius:999px;padding:4px 8px;background:#f1f3f6}
.badge.a{background:#ffe2e2;color:#a82e2e}.badge.r{background:#e5efff;color:#2e5db4}.badge.g{background:#dcf7e6;color:#187341}
.answer{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;line-height:1.65}
.detail-label{font-size:12px;color:var(--muted);margin-top:8px}
.nav-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:520px;margin:18px auto 0}
.nav-row .btn:nth-child(2){justify-self:stretch}
.complete-row{display:flex;justify-content:center;margin-top:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode-switch{display:flex;gap:4px;background:#f2f4f8;padding:4px;border-radius:11px;width:max-content}
.mode-btn{border:0;background:transparent;border-radius:8px;padding:8px 14px;color:var(--muted)}
.mode-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.session-box{margin-top:12px;padding:11px 12px;background:#f7f8fb;border:1px solid var(--line);border-radius:12px}
.session-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.session-label{font-size:13px;color:var(--muted);margin-right:2px}
.session-choice{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px}
.session-choice.active{background:var(--primary);border-color:var(--primary);color:#fff}
.session-hint{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.5}
.test-box{max-width:720px;margin:0 auto;padding:8px 0}
.question{font-size:23px;font-weight:720;line-height:1.45;margin:12px 0 16px}
.answer-input{width:100%;border:1px solid #cbd3df;border-radius:10px;padding:12px 13px}
.feedback{padding:12px;border-radius:10px;margin-top:12px;line-height:1.6}.feedback.good{background:var(--good-bg);color:var(--good)}.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.option-list{display:grid;gap:8px}.option{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;text-align:left}
.library-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;padding:2px 0;font-weight:700;color:var(--text)}
.library-body{margin-top:12px}
.search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
select{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
.slider-wrap{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:12px 0}
input[type="range"]{width:100%}
.library-list{display:grid;gap:8px}
.list-card{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.list-top{display:flex;justify-content:space-between;gap:12px}
.list-word{font-weight:700}
.library-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 8px;background:#f1f3f7;border-radius:999px;font-size:12px}
.footer-tools{margin-top:20px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px}
.footer-tools .toolbar{justify-content:center}
.footer-title{text-align:center;font-weight:700;margin-bottom:8px}
.footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.38);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:#fff;width:min(620px,100%);max-height:88vh;overflow:auto;border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.modal h3{margin:0 0 12px}.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.modal-stat{background:#f7f8fb;border-radius:10px;padding:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12px;line-height:1.5}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(max-width:720px){
 .app{padding:10px 10px 80px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
 .word{font-size:32px}.word-card{min-height:330px}.nav-row{gap:8px}.btn{padding:9px 10px}
 .question{font-size:21px}.panel{padding:13px}.modal-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>小许 A2 学习系统</h1>
  <div class="sub">单词 · 测试 · 错题 · 间隔复习</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="home">首页</button>
  <button class="tab" data-tab="vocab">单词</button>
  <button class="tab" data-tab="errors">错题</button>
</div>

<section id="home" class="view">
  <div class="grid">
    <div class="stat"><span>今日到期单词</span><b id="statDueVocab">0</b></div>
    <div class="stat"><span>薄弱维度</span><b id="statWeak">0</b></div>
    <div class="stat"><span>待复习错题</span><b id="statDueErrors">0</b></div>
    <div class="stat"><span>已学习单词</span><b id="statLearned">0</b></div>
  </div>
  <div class="panel">
    <h2>今天做什么</h2>
    <div class="two">
      <div class="item">
        <div class="item-title">📖 单词</div>
        <div class="item-meta" id="homeVocabHint"></div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn primary" onclick="goTab('vocab');showVocabMode('study')">继续学习</button>
          <button class="btn soft" onclick="goTab('vocab');showVocabMode('test')">开始测试</button>
        </div>
      </div>
      <div class="item">
        <div class="item-title">✏️ 错题</div>
        <div class="item-meta" id="homeErrorHint"></div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn primary" onclick="goTab('errors');startErrorReview()">复习到期错题</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="vocab" class="view hidden">
  <div class="panel">
    <div class="mode-switch">
      <button class="mode-btn active" id="studyModeBtn" onclick="showVocabMode('study')">学习</button>
      <button class="mode-btn" id="testModeBtn" onclick="showVocabMode('test')">测试</button>
    </div>

    <div id="studyMode">
      <div class="session-box">
        <div class="session-row">
          <span class="session-label">本轮学习新词：</span>
          <button class="session-choice active" data-study-size="10" onclick="setStudySize(10)">10 个</button>
          <button class="session-choice" data-study-size="20" onclick="setStudySize(20)">20 个</button>
          <button class="session-choice" data-study-size="30" onclick="setStudySize(30)">30 个</button>
          <button class="btn soft" onclick="startStudyRound()">开始 / 重新抽取本轮</button>
        </div>
        <div class="session-hint" id="studySessionHint">默认每轮 10 个尚未首次学习的新词。</div>
      </div>
      <div class="word-card">
        <div>
          <div class="counter" id="studyCounter">0 / 0</div>
          <div class="word-main">
            <div class="word" id="studyWord">—</div>
            <div class="meta" id="studyMeta"></div>
            <div class="badges" id="studyBadges"></div>
          </div>
          <div id="studyAnswer" class="answer hidden"></div>
        </div>
        <div>
          <div class="nav-row">
            <button class="btn" onclick="prevStudy()">← 上一个</button>
            <button class="btn primary" id="flipBtn" onclick="flipStudy()">翻转</button>
            <button class="btn" onclick="nextStudy()">下一个 →</button>
          </div>
          <div class="complete-row">
            <button class="btn soft hidden" id="learnedBtn" onclick="markLearned()">完成首次学习</button>
          </div>
        </div>
      </div>
    </div>

    <div id="testMode" class="hidden">
      <div class="session-box">
        <div class="session-row">
          <span class="session-label">今天测试的新词：</span>
          <button class="session-choice active" data-test-size="10" onclick="setTestSize(10)">10 个</button>
          <button class="session-choice" data-test-size="20" onclick="setTestSize(20)">20 个</button>
          <button class="session-choice" data-test-size="30" onclick="setTestSize(30)">30 个</button>
        </div>
        <div class="session-hint" id="testSessionHint">A 类：中文→输入俄语；R 类：俄语→中文四选一。G 与词义辨析仍单独测试。</div>
      </div>
      <div class="test-box">
        <div class="small" id="testType"></div>
        <div class="question" id="testQuestion">点击“开始测试”</div>
        <div id="testOptions" class="option-list hidden"></div>
        <input id="testInput" class="answer-input" placeholder="输入答案后按 Enter">
        <div id="testFeedback"></div>
        <div class="toolbar" style="justify-content:center;margin-top:14px">
          <button class="btn primary" id="startTestBtn" onclick="startTest()">开始测试</button>
          <button class="btn soft hidden" id="nextTestBtn" onclick="nextTest()">下一题</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <button class="library-toggle" onclick="toggleLibrary('vocab')">
      <span>▸ 单词库总览 <span class="small" id="vocabTotalLabel"></span></span>
      <span class="small" id="vocabToggleLabel">展开</span>
    </button>
    <div id="vocabLibrary" class="library-body hidden">
      <div class="library-summary" id="vocabSummary"></div>
      <div class="toolbar">
        <input id="vocabSearch" class="search" placeholder="搜索单词 / 中文 / 来源">
        <select id="vocabFilter">
          <option value="all">全部</option>
          <option value="new">未学</option>
          <option value="due">今日到期</option>
          <option value="weak">薄弱</option>
          <option value="A">A 主动</option>
          <option value="R">R 识别</option>
          <option value="G">G 格支配</option>
          <option value="archived">已归档</option>
        </select>
      </div>
      <div class="slider-wrap">
        <span class="small">1</span>
        <input id="vocabSlider" type="range" min="0" max="0" value="0">
        <span class="small" id="vocabSliderLabel">0 / 0</span>
      </div>
      <div id="vocabList" class="library-list"></div>
    </div>
  </div>
</section>

<section id="errors" class="view hidden">
  <div class="panel">
    <div class="toolbar">
      <button class="btn primary" onclick="startErrorReview()">复习到期错题</button>
    </div>
    <div id="errorReview" class="hidden">
      <div class="test-box">
        <div class="small" id="errorMeta"></div>
        <div class="question" id="errorQuestion"></div>
        <input id="errorInput" class="answer-input" placeholder="输入你的答案">
        <div id="errorFeedback"></div>
        <div class="toolbar" style="justify-content:center;margin-top:14px">
          <button class="btn primary" id="checkErrorBtn" onclick="checkError()">提交</button>
          <button class="btn soft hidden" id="nextErrorBtn" onclick="nextError()">下一题</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <button class="library-toggle" onclick="toggleLibrary('error')">
      <span>▸ 错题库总览 <span class="small" id="errorTotalLabel"></span></span>
      <span class="small" id="errorToggleLabel">展开</span>
    </button>
    <div id="errorLibrary" class="library-body hidden">
      <div class="library-summary" id="errorSummary"></div>
      <div class="toolbar">
        <input id="errorSearch" class="search" placeholder="搜索题目 / 标签 / 来源">
        <select id="errorFilter">
          <option value="all">全部</option>
          <option value="due">待复习</option>
          <option value="learning">巩固中</option>
          <option value="mastered">已掌握</option>
          <option value="archived">已归档</option>
        </select>
        <select id="errorTagFilter"><option value="all">全部知识点</option></select>
      </div>
      <div class="slider-wrap">
        <span class="small">1</span>
        <input id="errorSlider" type="range" min="0" max="0" value="0">
        <span class="small" id="errorSliderLabel">0 / 0</span>
      </div>
      <div id="errorList" class="library-list"></div>
    </div>
  </div>
</section>

<div class="footer-tools">
  <div class="footer-title">数据与学习包</div>
  <div class="toolbar">
    <button class="btn primary" id="importBtn">导入学习包</button>
    <button class="btn" id="exportBtn">导出完整进度</button>
    <button class="btn" id="backupBtn">查看备份</button>
    <button class="btn" id="resetBtn">重置示例</button>
    <input id="fileInput" type="file" accept=".json" class="hidden">
  </div>
  <div class="footer-note">导入前会自动备份；更新词条内容不会覆盖既有学习进度。为避免长期占空间，只保留最近 5 份自动备份。</div>
</div>
</div>

<div id="modalMask" class="modal-mask hidden"><div class="modal" id="modal"></div></div>

": "XU-E-000001", "prompt": "Анна вчера ___ в театр.", "student_answer": "ходил", "correct_answer": "ходила", "accepted_answers": ["ходила"], "explanation": "过去时需要和主语在性、数上保持一致；Анна 是阴性单数，所以用 ходила。", "tags": ["过去时", "性数一致"], "source": "示例错题", "revision": 1, "active": true}, {"id": "XU-E-000002", "prompt": "Мы едем ___ метро.", "student_answer": "в", "correct_answer": "на метро", "accepted_answers": ["на метро"], "explanation": "表示乘坐交通工具时常用 на + 前置格：на метро, на автобусе。", "tags": ["介词", "交通工具"], "source": "示例错题", "revision": 1, "active": true}, {"id": "XU-E-000003", "prompt": "Я горжусь ___ . (мой брат)", "student_answer": "мой брат", "correct_answer": "моим братом", "accepted_answers": ["моим братом"], "explanation": "гордиться кем? чем? 要求工具格（五格）。", "tags": ["格支配", "五格"], "source": "示例错题", "revision": 1, "active": true}]};

function clone(x){return JSON.parse(JSON.stringify(x))}
function now(){return Date.now()}
function normalize(s){
 return String(s??"").toLowerCase()
 .replace(/[́̀]/g,"").replace(/ё/g,"е")
 .replace(/[.,!?;:"'“”‘’()]/g," ").replace(/\s+/g," ").trim();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(ts){if(!ts)return"未安排";return new Date(ts).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}

function loadContent(){
 try{const x=JSON.parse(localStorage.getItem(STORAGE.content));if(x)return x}catch(e){}
 localStorage.setItem(STORAGE.content,JSON.stringify(SAMPLE_CONTENT));return clone(SAMPLE_CONTENT);
}
function defaultDim(){return{stage:0,nextReview:null,correct:0,wrong:0,streak:0,recent:[]}}
function ensureVocabProgress(id){
 if(!progress.vocab[id])progress.vocab[id]={learned:false,learnedAt:null,learnedDay:null,needsReconfirm:false,dims:{recognition:defaultDim(),active:defaultDim(),government:defaultDim(),sense:defaultDim()}};
if(!("learnedDay" in progress.vocab[id]))progress.vocab[id].learnedDay=progress.vocab[id].learnedAt?localDayKey(progress.vocab[id].learnedAt):null;
 return progress.vocab[id];
}
function ensureErrorProgress(id){
 if(!progress.errors[id])progress.errors[id]={stage:0,nextReview:now(),correct:0,wrong:0,status:"due",recent:[],needsReconfirm:false};
 return progress.errors[id];
}
function loadProgress(){
 let p={vocab:{},errors:{}};
 try{const x=JSON.parse(localStorage.getItem(STORAGE.progress));if(x)p=x}catch(e){}
 if(!p.vocab)p.vocab={};if(!p.errors)p.errors={};
 return p;
}
function saveProgress(){localStorage.setItem(STORAGE.progress,JSON.stringify(progress))}

function activeVocab(){return content.vocabulary.filter(v=>v.active!==false)}
function activeErrors(){return content.errors.filter(e=>e.active!==false)}
function localDayKey(ts=now()){
 const d=new Date(ts);
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

 document.querySelectorAll("[data-study-size]").forEach(b=>b.classList.toggle("active",Number(b.dataset.studySize)===n));
 document.getElementById("studySessionHint").textContent=`本轮将抽取最多 ${n} 个尚未首次学习的新词。`;
}

 testNewWordLimit=n;
 document.querySelectorAll("[data-test-size]").forEach(b=>b.classList.toggle("active",Number(b.dataset.testSize)===n));
 const eligible=activeVocab().filter(v=>{const p=ensureVocabProgress(v.id);return p.learned&&p.learnedDay===localDayKey()}).length;
 document.getElementById("testSessionHint").textContent=`今天已完成首次学习 ${eligible} 个；本轮最多抽取 ${n} 个新词。A 类输入俄语，R 类中文四选一；旧词到期复习另行加入。`;

function startStudyRound(){
 const candidates=activeVocab().filter(v=>!ensureVocabProgress(v.id).learned);
 studyRoundIds=candidates.slice(0,studyBatchSize).map(v=>v.id);
 studyRoundCompleted=false;
 studyIndex=0;
 renderStudy();
 const actual=studyRoundIds.length;
 document.getElementById("studySessionHint").textContent=actual
   ? `本轮共 ${actual} 个新词；完成首次学习后会立刻从本轮队列移除。`
   : "当前没有尚未首次学习的新词。";

function dimForTask(type){return type==="R_ZH"?"recognition":type==="A_RU"?"active":type==="G"?"government":"sense"}
function relevantDims(v){
 const a=[v.level==="A" ? "active" : "recognition"];
 if(v.g&&(v.government||[]).length)a.push("government");
 if(v.sense_question)a.push("sense");
 return a;
}
function recentWeak(dim){
 const r=(dim.recent||[]).slice(-5);
 if(!r.length)return false;
 const wrong=r.filter(x=>x===0).length;
 return wrong>=2 || (dim.streak===0 && dim.wrong>0) || wrong/r.length>=0.4;
}
function vocabWeakCount(v){const p=ensureVocabProgress(v.id);return relevantDims(v).filter(k=>recentWeak(p.dims[k])).length}
function isDueDim(d){return d.nextReview!=null && d.nextReview<=now()}
function dueVocabTasksCount(){
 let n=0;activeVocab().forEach(v=>{const p=ensureVocabProgress(v.id);if(!p.learned)return;relevantDims(v).forEach(k=>{if(isDueDim(p.dims[k]))n++})});return n
}
function dueErrorCount(){return activeErrors().filter(e=>ensureErrorProgress(e.id).nextReview<=now()).length}

}

}

function studyFiltered(){
 const av=activeVocab();
 const f=document.getElementById("vocabFilter")?.value||"all";
 const q=normalize(document.getElementById("vocabSearch")?.value||"");
 return av.filter(v=>{
   if(q&&!normalize([v.word,v.plain,v.meaning,v.source].join(" ")).includes(q))return false;
   const p=ensureVocabProgress(v.id);
   if(f==="new")return!p.learned;
   if(f==="due")return p.learned&&relevantDims(v).some(k=>isDueDim(p.dims[k]));
   if(f==="weak")return vocabWeakCount(v)>0;
   if(f==="A"||f==="R")return v.level===f;
   if(f==="G")return !!v.g;
   if(f==="archived")return false;
   return true;
 })
}

 if(studyIndex>=studyList.length)studyIndex=Math.max(0,studyList.length-1);
 const v=studyList[studyIndex];
 document.getElementById("studyCounter").textContent=`${studyIndex+1} / ${studyList.length}`;
 flipBtn.disabled=false;studyFlipped=false;
 const p=ensureVocabProgress(v.id);
 studyWord.textContent=v.word;
 studyMeta.textContent=[v.pos,v.source].filter(Boolean).join(" · ");
 studyBadges.innerHTML=`<span class="badge ${v.level.toLowerCase()}">${v.level==="A"?"A 主动":"R 识别"}</span>${v.g?'<span class="badge g">G 格支配</span>':""}${vocabWeakCount(v)?'<span class="badge">薄弱</span>':""}${p.needsReconfirm?'<span class="badge">内容已修订</span>':""}`;
 const aspect=v.aspect?`${v.aspect.impf||"—"} / ${v.aspect.pf||"—"}`:"";
 const gov=(v.government||[]).map(g=>`${esc(g.pattern)} <span class="small">(${esc(g.case_cn||g.case||"")})</span>`).join("<br>");
 studyAnswer.innerHTML=`
 <div><div class="detail-label">核心义</div>${esc(v.meaning)}</div>
 ${aspect?`<div><div class="detail-label">未完成体 / 完成体</div>${esc(aspect)}</div>`:""}
 ${gov?`<div><div class="detail-label">格支配</div>${gov}</div>`:""}
 ${(v.usage||[]).length?`<div><div class="detail-label">基本用法</div>${v.usage.map(esc).join("；")}</div>`:""}
 ${v.example?`<div><div class="detail-label">例句</div>${esc(v.example)}</div>`:""}
 ${v.sense_question?`<div><div class="detail-label">词义辨析</div>${esc(v.sense_question.prompt)}</div>`:""}`;
 studyAnswer.classList.add("hidden");flipBtn.textContent="翻转";
 learnedBtn.classList.add("hidden");
}
function flipStudy(){
 if(!studyList.length)return;
 studyFlipped=!studyFlipped;studyAnswer.classList.toggle("hidden",!studyFlipped);flipBtn.textContent=studyFlipped?"收起":"翻转";
 const v=studyList[studyIndex],p=ensureVocabProgress(v.id);
 learnedBtn.classList.toggle("hidden",p.learned||!studyFlipped);
}
function markLearned(){
 const v=studyList[studyIndex];if(!v||!studyFlipped)return;
 const p=ensureVocabProgress(v.id);
 p.learned=true;p.learnedAt=p.learnedAt||now();p.learnedDay=p.learnedDay||localDayKey();p.needsReconfirm=false;
 relevantDims(v).forEach(k=>{const d=p.dims[k];if(d.nextReview==null)d.nextReview=now()+REVIEW_INTERVALS[0]});

 // A completed word leaves the learning queue immediately.
 studyRoundIds=studyRoundIds.filter(id=>id!==v.id);
 if(studyIndex>=studyRoundIds.length)studyIndex=Math.max(0,studyRoundIds.length-1);
 if(studyRoundIds.length===0)studyRoundCompleted=true;

 saveProgress();renderAll();renderStudy();
 document.getElementById("studySessionHint").textContent=studyRoundCompleted
   ? "本轮已完成。下一轮只会抽取仍未首次学习的词。"
   : `本轮还剩 ${studyRoundIds.length} 个未完成首次学习。`;
}

   renderStudy();
   if(!studyRoundCompleted && studyRoundIds.length){
     document.getElementById("studySessionHint").textContent=`本轮还剩 ${studyRoundIds.length} 个未完成首次学习。`;

function acceptedActive(v){
 const vals=new Set((v.accepted_active_answers||[]).map(normalize).filter(Boolean));
 if(v.plain)vals.add(normalize(v.plain));
 if(v.word)vals.add(normalize(v.word));
 if(v.aspect){if(v.aspect.impf)vals.add(normalize(v.aspect.impf));if(v.aspect.pf)vals.add(normalize(v.aspect.pf))}
 return [...vals];
}
function acceptedMeanings(v){
 return [...new Set([v.meaning,...(v.accepted_meanings||[])].map(normalize).filter(Boolean))]
}

function shuffleCopy(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function primaryMeaning(v){
 const arr=(v.accepted_meanings||[]).filter(Boolean);
 return arr[0] || v.meaning || "";
}

function buildRecognitionOptions(v){
 const correct=primaryMeaning(v);
 const correctNorm=normalize(correct);

 // Prefer distractors with the same part of speech/category.
 let candidates=activeVocab().filter(x=>
   x.id!==v.id &&
   x.pos===v.pos &&
   normalize(primaryMeaning(x))!==correctNorm
 );

 // If same-POS pool is too small, broaden carefully.
 if(candidates.length<3){
   const extra=activeVocab().filter(x=>
     x.id!==v.id &&
     normalize(primaryMeaning(x))!==correctNorm &&
     !candidates.some(c=>c.id===x.id)
   );
   candidates=candidates.concat(extra);
 }

 const picked=[];
 const seen=new Set([correctNorm]);
 for(const x of shuffleCopy(candidates)){
   const m=primaryMeaning(x);
   const n=normalize(m);
   if(!m || seen.has(n)) continue;
   // Avoid distractors that substantially overlap the correct Chinese wording.
   if(correctNorm.includes(n) || n.includes(correctNorm)) continue;
   picked.push(m);
   seen.add(n);
   if(picked.length===3) break;
 }

 // Fallback labels only if the vocabulary is too tiny to form 4 real options.
 while(picked.length<3){
   const fallback=["其他含义","另一个词义","以上都不是"][picked.length];
   if(!seen.has(normalize(fallback))) picked.push(fallback);
 }

 return shuffleCopy([correct,...picked.slice(0,3)]);
}
function tasksForVocab(v,{forceAll=false}={}){
 const p=ensureVocabProgress(v.id),tasks=[];
 const add=(type,extra={})=>{
   const d=p.dims[dimForTask(type)];
   if(forceAll||isDueDim(d)||p.needsReconfirm)tasks.push({vocabId:v.id,type,...extra});
 };
 // A: Chinese -> Russian only. R: Russian -> Chinese only.
 if(v.level==="A")add("A_RU");
 else add("R_ZH");
 if(v.g)(v.government||[]).forEach((g,i)=>add("G",{govIndex:i}));
 if(v.sense_question)add("SENSE");
 return tasks;
}
function buildTestQueue(){
 const today=localDayKey();
 const learned=activeVocab().filter(v=>ensureVocabProgress(v.id).learned);

 // 1) Old/due review tasks: learned before today, or today's words whose dimensions are already due.
 let reviewTasks=[];
 learned.forEach(v=>{
   const p=ensureVocabProgress(v.id);
   const due=tasksForVocab(v,{forceAll:false});
   if(p.learnedDay!==today) reviewTasks.push(...due);
 });

 // 2) Today's newly learned words: choose at most 10/20/30 WORDS.
 // A selected word can generate multiple tasks (R/A/G/sense).
 const todaysNew=learned.filter(v=>ensureVocabProgress(v.id).learnedDay===today);
 const selectedNew=todaysNew.slice(0,testNewWordLimit);
 let newTasks=[];
 selectedNew.forEach(v=>newTasks.push(...tasksForVocab(v,{forceAll:true})));

 // If a today's-new word has already been tested in this session and is now due because of an error,
 // retry insertion is handled later by checkTest().
 return [...reviewTasks.sort(()=>Math.random()-.5),...newTasks.sort(()=>Math.random()-.5)];
}
function startTest(){
 const eligible=activeVocab().filter(v=>{const p=ensureVocabProgress(v.id);return p.learned&&p.learnedDay===localDayKey()}).length;
 document.getElementById("testSessionHint").textContent=eligible<testNewWordLimit
   ? `今天只完成了 ${eligible} 个新词的首次学习，因此本轮新词最多测试 ${eligible} 个；不会加入未学习词。A 类输入俄语，R 类中文四选一。`
   : `本轮测试 ${testNewWordLimit} 个今天新学词；A 类输入俄语，R 类中文四选一；旧词到期复习照常加入。`;
 testQueue=buildTestQueue();startTestBtn.classList.add("hidden");nextTestBtn.classList.add("hidden");
 if(!testQueue.length){testQuestion.textContent="还没有可测试内容。先完成新词首次学习，或等待旧词复习到期。";startTestBtn.classList.remove("hidden");return}
 loadNextTest();
}
function loadNextTest(){
 testFeedback.innerHTML="";testOptions.innerHTML="";testOptions.classList.add("hidden");testInput.classList.remove("hidden");testInput.disabled=false;testInput.value="";
 currentTest=testQueue.shift();
 if(!currentTest){testType.textContent="";testQuestion.textContent="🎉 本轮测试完成";testInput.classList.add("hidden");startTestBtn.classList.remove("hidden");startTestBtn.textContent="再来一轮";renderAll();return}
 const v=content.vocabulary.find(x=>x.id===currentTest.vocabId);
 if(currentTest.type==="R_ZH"){
   testType.textContent="R · 识别词 · 俄 → 中";
   testQuestion.textContent=v.word;
   testInput.classList.add("hidden");
   testOptions.classList.remove("hidden");
   buildRecognitionOptions(v).forEach(opt=>{
     const b=document.createElement("button");
     b.className="option";
     b.textContent=opt;
     b.onclick=()=>checkTest(opt);
     testOptions.appendChild(b);
   });
 }
 if(currentTest.type==="A_RU"){testType.textContent="A · 中 → 俄";testQuestion.textContent=v.meaning;testInput.placeholder="未完成体或完成体均可；不要求输入重音"}
 if(currentTest.type==="G"){
   const g=v.government[currentTest.govIndex];
   testType.textContent="G · 格支配";
   testQuestion.textContent=`${v.word}：${g.pattern} —— 要求第几格？`;
   testInput.placeholder=`可答：${g.case_cn||"格"} / ${g.case||""} / 格问词或完整结构`;
}
 if(currentTest.type==="SENSE"){testType.textContent="词义辨析";testQuestion.textContent=v.sense_question.prompt;testInput.classList.add("hidden");testOptions.classList.remove("hidden");v.sense_question.options.forEach(o=>{const b=document.createElement("button");b.className="option";b.textContent=o;b.onclick=()=>checkTest(o);testOptions.appendChild(b)})}
 setTimeout(()=>{if(!testInput.classList.contains("hidden"))testInput.focus()},30);
}
testInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!testInput.disabled)checkTest(testInput.value)});
function matchesAny(raw,arr){
 const x=normalize(raw);return arr.some(a=>{const y=normalize(a);return x===y || (/[一-龥]/.test(x)&&x.length>0&&(y.includes(x)||x.includes(y)))})
}

function stripGovernmentPrepositions(s){
 const preps=new Set([
   "в","во","на","за","с","со","о","об","обо","к","ко","от","до","из","изо","у",
   "для","без","после","перед","под","над","между","через","про","по","при"
 ]);
 return normalize(s).split(" ").filter(t=>t && !preps.has(t)).join(" ");
}

function governmentCasePair(caseNo){
 const pairs={
   1:["кто что"],
   2:["кого чего"],
   3:["кому чему"],
   4:["кого что"],
   5:["кем чем"],
   6:["ком чем"]
 };
 return pairs[caseNo]||[];
}

function governmentMatches(raw,g){
 // Existing labels/numbers remain valid.
 if(matchesAny(raw,g.accepted_answers||[])) return true;

 // For a case-government question, prepositions are part of the lexical structure,
 // but they should not make an otherwise correct case answer fail.
 const x=stripGovernmentPrepositions(raw);
 const accepted=(g.accepted_answers||[]).map(stripGovernmentPrepositions);
 if(accepted.includes(x)) return true;

 // Accept the normal paired case questions, e.g. кого? что?,
 // regardless of whether the learner writes the governing preposition(s).
 const pairs=governmentCasePair(Number(g.case_no));
 if(pairs.includes(x)) return true;

 return false;
}

function governmentAnswerLabel(g){
 const caseLabel=[g.case_cn,g.case].filter(Boolean).join(" / ");
 return `${caseLabel}${g.pattern?`；结构：${g.pattern}`:""}`;
}
function checkTest(raw){
 const v=content.vocabulary.find(x=>x.id===currentTest.vocabId);let ok=false,ans="";
 if(currentTest.type==="R_ZH"){
   ok=acceptedMeanings(v).includes(normalize(raw));
   ans=primaryMeaning(v);
 }
 if(currentTest.type==="A_RU"){ok=acceptedActive(v).includes(normalize(raw));ans=acceptedActive(v).join(" / ")}
 if(currentTest.type==="G"){
   const g=v.government[currentTest.govIndex];
   ok=governmentMatches(raw,g);
   ans=governmentAnswerLabel(g);
 }
 if(currentTest.type==="SENSE"){ok=normalize(raw)===normalize(v.sense_question.answer);ans=v.sense_question.answer}
 recordVocab(v,currentTest.type,ok);
 testInput.disabled=true;[...testOptions.children].forEach(x=>x.disabled=true);
 testFeedback.innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ 正确":"❌ 这次不对"}<br><span class="small">可接受答案：${esc(ans)}</span></div>`;
 if(!ok&&!currentTest.retry)testQueue.splice(Math.min(3,testQueue.length),0,{...currentTest,retry:true});
 nextTestBtn.classList.remove("hidden");saveProgress();renderAll();
}
function recordVocab(v,type,ok){
 const p=ensureVocabProgress(v.id),d=p.dims[dimForTask(type)];
 d.recent=(d.recent||[]).slice(-9);d.recent.push(ok?1:0);
 if(ok){d.correct++;d.streak++;d.stage=Math.min(d.stage+1,REVIEW_INTERVALS.length-1);const factor=recentWeak(d)?.55:1;d.nextReview=now()+Math.max(REVIEW_INTERVALS[0],Math.round(REVIEW_INTERVALS[d.stage]*factor))}
 else{d.wrong++;d.streak=0;d.stage=Math.max(0,d.stage-2);d.nextReview=now()+REVIEW_INTERVALS[0]}
 p.needsReconfirm=false;
}
function nextTest(){nextTestBtn.classList.add("hidden");loadNextTest()}

function errorStatus(e){const p=ensureErrorProgress(e.id);if(p.status==="mastered")return"已掌握";if(p.nextReview<=now())return"待复习";return"巩固中"}
function startErrorReview(){
 goTab("errors");errorQueue=activeErrors().filter(e=>ensureErrorProgress(e.id).nextReview<=now()||ensureErrorProgress(e.id).needsReconfirm);
 errorReview.classList.remove("hidden");
 if(!errorQueue.length){errorQuestion.textContent="🎉 当前没有到期错题";errorMeta.textContent="";errorInput.classList.add("hidden");checkErrorBtn.classList.add("hidden");nextErrorBtn.classList.add("hidden");return}
 errorInput.classList.remove("hidden");checkErrorBtn.classList.remove("hidden");loadError();
}
function loadError(){
 errorFeedback.innerHTML="";nextErrorBtn.classList.add("hidden");checkErrorBtn.classList.remove("hidden");errorInput.disabled=false;errorInput.value="";errorInput.classList.remove("hidden");
 currentError=errorQueue.shift();
 if(!currentError){errorQuestion.textContent="🎉 本轮错题复习完成";errorMeta.textContent="";errorInput.classList.add("hidden");checkErrorBtn.classList.add("hidden");saveProgress();renderAll();return}
 errorQuestion.textContent=currentError.prompt;errorMeta.textContent=`${(currentError.tags||[]).join(" / ")} · ${currentError.source||""}`;errorInput.focus();
}
errorInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!errorInput.disabled)checkError()});
function checkError(){
 const e=currentError,p=ensureErrorProgress(e.id),ok=matchesAny(errorInput.value,[e.correct_answer,...(e.accepted_answers||[])]);
 p.recent=(p.recent||[]).slice(-9);p.recent.push(ok?1:0);
 if(ok){p.correct++;p.stage=Math.min(p.stage+1,ERROR_INTERVALS.length-1);p.nextReview=now()+ERROR_INTERVALS[p.stage];p.status=p.stage>=3?"mastered":"learning";p.needsReconfirm=false}
 else{p.wrong++;p.stage=0;p.nextReview=now()+10*60e3;p.status="due";if(!e._retry){e._retry=true;errorQueue.splice(Math.min(2,errorQueue.length),0,e)}}
 errorInput.disabled=true;errorFeedback.innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ 正确":"❌ 这次不对"}<br><b>正确答案：</b>${esc(e.correct_answer)}<br><b>当时答案：</b>${esc(e.student_answer)}<br><span class="small">${esc(e.explanation)}</span></div>`;
 checkErrorBtn.classList.add("hidden");nextErrorBtn.classList.remove("hidden");saveProgress();renderAll();
}
function nextError(){loadError()}

function toggleLibrary(which){
 const body=document.getElementById(which==="vocab"?"vocabLibrary":"errorLibrary");
 const lab=document.getElementById(which==="vocab"?"vocabToggleLabel":"errorToggleLabel");
 const show=body.classList.contains("hidden");body.classList.toggle("hidden",!show);lab.textContent=show?"收起":"展开";
 if(show){which==="vocab"?renderVocabLibrary():renderErrorLibrary()}
}
function renderVocabLibrary(){
 const f=vocabFilter.value,q=normalize(vocabSearch.value);
 let arr=content.vocabulary.filter(v=>{
   const p=ensureVocabProgress(v.id),active=v.active!==false;
   if(f==="archived")return !active;
   if(!active)return false;
   if(q&&!normalize([v.word,v.plain,v.meaning,v.source].join(" ")).includes(q))return false;
   if(f==="new")return!p.learned;if(f==="due")return p.learned&&relevantDims(v).some(k=>isDueDim(p.dims[k]));if(f==="weak")return vocabWeakCount(v)>0;
   if(f==="A"||f==="R")return v.level===f;if(f==="G")return!!v.g;return true;
 });
 const max=Math.max(0,arr.length-1);vocabSlider.max=max;
 let start=Math.min(Number(vocabSlider.value)||0,max);vocabSlider.value=start;
 vocabSliderLabel.textContent=arr.length?`${start+1} / ${arr.length}`:"0 / 0";
 const shown=arr.slice(start,start+VISIBLE_BATCH);
 vocabList.innerHTML=shown.map(v=>{const p=ensureVocabProgress(v.id);return`<div class="list-card"><div class="list-top"><div><div class="list-word">${esc(v.word)}</div><div class="item-meta">${esc(v.meaning)} · ${v.level}${v.g?"/G":""} · ${esc(v.source||"")}</div></div><div class="small">${v.active===false?"已归档":p.learned?"已学":"未学"}</div></div><div class="item-meta">${p.learned?`${v.level==="A"?`A:${p.dims.active.stage+1}`:`R:${p.dims.recognition.stage+1}`}${v.g?` · G:${p.dims.government.stage+1}`:""}${v.sense_question?` · 辨析:${p.dims.sense.stage+1}`:""}`:"等待首次学习"}${vocabWeakCount(v)?` · ⚠️ ${vocabWeakCount(v)} 个薄弱维度`:""}</div></div>`}).join("")||'<div class="small">没有符合条件的词。</div>';
 const av=activeVocab();vocabSummary.innerHTML=`<span class="chip">总词数 ${av.length}</span><span class="chip">A ${av.filter(v=>v.level==="A").length}</span><span class="chip">R ${av.filter(v=>v.level==="R").length}</span><span class="chip">G ${av.filter(v=>v.g).length}</span><span class="chip">未学 ${av.filter(v=>!ensureVocabProgress(v.id).learned).length}</span>`;
 vocabTotalLabel.textContent=`${av.length} 个`;
}
function renderErrorLibrary(){
 const f=errorFilter.value,tag=errorTagFilter.value,q=normalize(errorSearch.value);
 let arr=content.errors.filter(e=>{
   const p=ensureErrorProgress(e.id),active=e.active!==false;
   if(f==="archived")return!active;if(!active)return false;
   if(q&&!normalize([e.prompt,(e.tags||[]).join(" "),e.source].join(" ")).includes(q))return false;
   if(tag!=="all"&&!(e.tags||[]).includes(tag))return false;
   if(f==="due")return p.nextReview<=now();if(f==="learning")return p.status==="learning";if(f==="mastered")return p.status==="mastered";return true;
 });
 const max=Math.max(0,arr.length-1);errorSlider.max=max;let start=Math.min(Number(errorSlider.value)||0,max);errorSlider.value=start;errorSliderLabel.textContent=arr.length?`${start+1} / ${arr.length}`:"0 / 0";
 errorList.innerHTML=arr.slice(start,start+VISIBLE_BATCH).map(e=>{const p=ensureErrorProgress(e.id);return`<div class="list-card"><div class="list-word">${esc(e.prompt)}</div><div class="item-meta">当时：${esc(e.student_answer)} → 正确：${esc(e.correct_answer)}</div><div class="item-meta">${esc((e.tags||[]).join(" / "))} · ${esc(e.source||"")} · ${e.active===false?"已归档":errorStatus(e)} · 下次 ${fmt(p.nextReview)}</div></div>`}).join("")||'<div class="small">没有符合条件的错题。</div>';
 const ae=activeErrors(),tags=[...new Set(ae.flatMap(e=>e.tags||[]))].sort();
 if(errorTagFilter.options.length!==tags.length+1){errorTagFilter.innerHTML='<option value="all">全部知识点</option>'+tags.map(t=>`<option>${esc(t)}</option>`).join("")}
 errorSummary.innerHTML=`<span class="chip">总错题 ${ae.length}</span><span class="chip">待复习 ${ae.filter(e=>ensureErrorProgress(e.id).nextReview<=now()).length}</span><span class="chip">巩固中 ${ae.filter(e=>ensureErrorProgress(e.id).status==="learning").length}</span><span class="chip">已掌握 ${ae.filter(e=>ensureErrorProgress(e.id).status==="mastered").length}</span>`;
 errorTotalLabel.textContent=`${ae.length} 道`;
}
["vocabSearch"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{vocabSlider.value=0;renderVocabLibrary()}));
vocabFilter.addEventListener("change",()=>{vocabSlider.value=0;renderVocabLibrary()});
vocabSlider.addEventListener("input",renderVocabLibrary);
["errorSearch"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{errorSlider.value=0;renderErrorLibrary()}));
errorFilter.addEventListener("change",()=>{errorSlider.value=0;renderErrorLibrary()});
errorTagFilter.addEventListener("change",()=>{errorSlider.value=0;renderErrorLibrary()});
errorSlider.addEventListener("input",renderErrorLibrary);

function getBackups(){try{return JSON.parse(localStorage.getItem(STORAGE.backups))||[]}catch(e){return[]}}
function autoBackup(){
 const b=getBackups();b.unshift({time:now(),content:clone(content),progress:clone(progress)});localStorage.setItem(STORAGE.backups,JSON.stringify(b.slice(0,5)));
}
function majorVocabChange(old,nw){
 const oldGov=JSON.stringify((old.government||[]).map(x=>[normalize(x.pattern),normalize(x.case),x.case_no]));
 const newGov=JSON.stringify((nw.government||[]).map(x=>[normalize(x.pattern),normalize(x.case),x.case_no]));
 const oldAsp=JSON.stringify(old.aspect||null),newAsp=JSON.stringify(nw.aspect||null);
 return normalize(old.plain)!==normalize(nw.plain)||oldGov!==newGov||oldAsp!==newAsp;
}
function majorErrorChange(old,nw){
 return normalize(old.correct_answer)!==normalize(nw.correct_answer)||JSON.stringify((old.accepted_answers||[]).map(normalize).sort())!==JSON.stringify((nw.accepted_answers||[]).map(normalize).sort());
}
function inspectImport(pack){
 const byV=new Map(content.vocabulary.map(x=>[x.id,x])),byE=new Map(content.errors.map(x=>[x.id,x]));
 let stats={vNew:0,vUpdate:0,vSame:0,vMajor:0,eNew:0,eUpdate:0,eSame:0,eMajor:0};
 (pack.vocabulary||[]).forEach(n=>{const o=byV.get(n.id);if(!o)stats.vNew++;else if(JSON.stringify(o)===JSON.stringify(n))stats.vSame++;else{stats.vUpdate++;if(majorVocabChange(o,n))stats.vMajor++}});
 (pack.errors||[]).forEach(n=>{const o=byE.get(n.id);if(!o)stats.eNew++;else if(JSON.stringify(o)===JSON.stringify(n))stats.eSame++;else{stats.eUpdate++;if(majorErrorChange(o,n))stats.eMajor++}});
 return stats;
}
function applyImport(pack){
 autoBackup();
 const byV=new Map(content.vocabulary.map(x=>[x.id,x])),byE=new Map(content.errors.map(x=>[x.id,x]));
 (pack.vocabulary||[]).forEach(n=>{
   const o=byV.get(n.id);
   if(!o){content.vocabulary.push(n);ensureVocabProgress(n.id)}
   else{const major=majorVocabChange(o,n);Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,n);if(major)ensureVocabProgress(n.id).needsReconfirm=true}
 });
 (pack.errors||[]).forEach(n=>{
   const o=byE.get(n.id);
   if(!o){content.errors.push(n);ensureErrorProgress(n.id)}
   else{const major=majorErrorChange(o,n);Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,n);if(major)ensureErrorProgress(n.id).needsReconfirm=true}
 });
 content.batch=pack.batch||content.batch;saveAll();
}
function showModal(html){modal.innerHTML=html;modalMask.classList.remove("hidden")}
function hideModal(){modalMask.classList.add("hidden")}
modalMask.addEventListener("click",e=>{if(e.target===modalMask)hideModal()});

importBtn.onclick=()=>fileInput.click();
fileInput.onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const pack=JSON.parse(await f.text());
  const s=inspectImport(pack);
  window._pendingPack=pack;
  showModal(`<h3>导入预览</h3>
   <div class="modal-grid">
    <div class="modal-stat"><b>新词</b><br>${s.vNew}</div><div class="modal-stat"><b>更新词条</b><br>${s.vUpdate}</div>
    <div class="modal-stat"><b>词条无变化</b><br>${s.vSame}</div><div class="modal-stat"><b>重大词条修订</b><br>${s.vMajor}</div>
    <div class="modal-stat"><b>新错题</b><br>${s.eNew}</div><div class="modal-stat"><b>更新错题</b><br>${s.eUpdate}</div>
    <div class="modal-stat"><b>错题无变化</b><br>${s.eSame}</div><div class="modal-stat"><b>重大错题修订</b><br>${s.eMajor}</div>
   </div>
   <div class="notice" style="margin-top:12px">现有学习进度不会被覆盖。重大修订只会标记“需要重新确认”，历史成绩仍保留。确认导入前会自动备份。</div>
   <div class="modal-actions"><button class="btn" onclick="hideModal()">取消</button><button class="btn primary" onclick="applyImport(window._pendingPack);hideModal()">确认导入</button></div>`);
 }catch(err){showModal(`<h3>导入失败</h3><div class="notice">${esc(err.message)}</div><div class="modal-actions"><button class="btn" onclick="hideModal()">关闭</button></div>`)}
 e.target.value="";
}
exportBtn.onclick=()=>{
 const payload={schema_version:"2.0-export",exported_at:new Date().toISOString(),content,progress};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`XUXU-A2-FULL-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)
}
backupBtn.onclick=()=>{
 const b=getBackups();
 showModal(`<h3>最近自动备份</h3>${b.length?b.map((x,i)=>`<div class="item" style="margin-top:8px"><b>${new Date(x.time).toLocaleString("zh-CN")}</b><div class="item-meta">备份 ${i+1} · ${x.content.vocabulary.length} 词 · ${x.content.errors.length} 错题</div><button class="btn" style="margin-top:8px" onclick="restoreBackup(${i})">恢复此备份</button></div>`).join(""):'<div class="small">还没有自动备份。第一次导入学习包前会自动建立。</div>'}<div class="modal-actions"><button class="btn" onclick="hideModal()">关闭</button></div>`);
}
function restoreBackup(i){const b=getBackups()[i];if(!b)return;content=clone(b.content);progress=clone(b.progress);saveAll();hideModal()}
resetBtn.onclick=()=>{if(confirm("确定重置为示例数据吗？当前本地学习数据会清空。")){content=clone(SAMPLE_CONTENT);progress={vocab:{},errors:{}};studyRoundIds=[];studyRoundCompleted=false;studyIndex=0;saveAll()}}

function renderAll(){
 renderHome();renderStudy();
 vocabTotalLabel.textContent=`${activeVocab().length} 个`;errorTotalLabel.textContent=`${activeErrors().length} 道`;
 if(!vocabLibrary.classList.contains("hidden"))renderVocabLibrary();
 if(!errorLibrary.classList.contains("hidden"))renderErrorLibrary();
}
document.documentElement.style.overflowY="auto";
document.body.style.overflowY="auto";
document.body.style.position="static";
setStudySize(10);
setTestSize(10);
renderAll();
</script>
